[project]
name = "bacterial-colony-analyzer"
version = "0.1.0"
description = "Анализатор бактериальных колоний на изображениях чашек Петри"
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.4.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.100.0",
]
dev = [
    "nuitka>=4.0.0",
    "zstandard>=0.25.0",
    "bacterial-colony-analyzer[test]",
]
full = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnxscript",
    "tensorboard>=2.17.0",
    "plotly>=5.18.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "rich>=13.7.0",
    "albumentations>=1.3.0",
    "onnxruntime>=1.18.0",
    "tqdm>=4.65.0",
    "bacterial-colony-analyzer[dev]",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["analysis", "analysis.*", "ui", "ui.*", "utils", "utils.*", "labeling", "labeling.*", "train", "train.*", "testing", "testing.*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: тесты, требующие загрузки реальных изображений (>0.5s)",
    "gui: тесты, требующие QApplication",
    "hypothesis: property-based тесты",
]

[project.scripts]
bacteria-analyzer = "main:main"
augment = "train.augment:main"
test-algorithms = "testing.__main__:main"
import-22022540 = "train.importer_cli:main"
baseline = "testing.__main__:main"
evaluate = "testing.__main__:main_evaluate"
