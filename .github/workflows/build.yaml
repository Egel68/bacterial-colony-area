name: Build BacteriaAnalyzer

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-executable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pyinstaller \
            --onefile \
            --windowed \
            --name=BacteriaAnalyzer \
            --icon=icon.ico \
            --hidden-import=PyQt6.sip \
            --hidden-import=albumentations \
            --hidden-import=tqdm \
            main.py

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          uv run pyinstaller `
            --onefile `
            --windowed `
            --name=BacteriaAnalyzer `
            --icon=icon.ico `
            --hidden-import=PyQt6.sip `
            --hidden-import=albumentations `
            --hidden-import=tqdm `
            main.py

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Linux
          path: dist/BacteriaAnalyzer

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Windows
          path: dist/BacteriaAnalyzer.exe
