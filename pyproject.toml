[project]
name = "bacterial-colony-analyzer"
version = "1.0.0"
description = "Анализатор бактериальных колоний на изображениях чашек Петри"
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.4.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "albumentations>=1.3.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "nuitka>=4.0.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["analysis", "analysis.*", "ui", "ui.*", "utils", "utils.*", "labeling", "labeling.*", "train", "train.*"]

[tool.setuptools]
py-modules = ["main"]

[project.scripts]
bacteria-analyzer = "main:main"
augment = "train.augment:main"
