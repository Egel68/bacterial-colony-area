name: Build BacteriaAnalyzer

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
  # Изменения feature/* проверяются через pull_request (включая synchronize),
  # чтобы каждый commit не запускал вторую такую же матрицу через push.
  push:
    branches:
      - develop
      - main
  # Позволяет вручную запустить проверку для ветки до открытия PR.
  workflow_dispatch:

jobs:
  build-executable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git default branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++ patchelf ccache

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Lint and format check
        run: |
          uv pip install ruff==0.15.20
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y libegl1
          uv run python -m pytest tests/ \
            --cov=analysis --cov=utils --cov=testing \
            --cov-report=term --cov-report=xml \
            -v --tb=short -m "not slow and not gui"

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run python -m pytest tests/ -v --tb=short -m "not slow and not gui"

      - name: Create clean runtime environment for build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-build uv sync --locked --exact
          uv pip install --python .venv-build nuitka zstandard

      - name: Create clean runtime environment for build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = ".venv-build"
          uv sync --locked --exact
          uv pip install --python .venv-build nuitka zstandard

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-build uv run --no-sync python scripts/nuitka_build.py \
            --standalone --onefile \
            --output-filename=BacteriaAnalyzer \
            main.py

      - name: Verify packaged CPU inference (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./BacteriaAnalyzer --smoke-test-model NN:colony_seg
          ./BacteriaAnalyzer --smoke-test-model NN:colony_mobilenet_v3_small

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = ".venv-build"
          uv run --no-sync python scripts/nuitka_build.py `
            --standalone --onefile `
            --msvc=latest `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --output-filename=BacteriaAnalyzer.exe `
            main.py

      - name: Verify packaged CPU inference (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\BacteriaAnalyzer.exe --smoke-test-model NN:colony_seg
          .\BacteriaAnalyzer.exe --smoke-test-model NN:colony_mobilenet_v3_small

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: BacteriaAnalyzer-Linux
          path: BacteriaAnalyzer

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: BacteriaAnalyzer-Windows
          path: BacteriaAnalyzer.exe
