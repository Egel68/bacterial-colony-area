name: Build BacteriaAnalyzer

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - main
      - feature/*

jobs:
  build-executable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++ patchelf

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          uv run python -m pytest tests/ \
            --cov=analysis --cov=utils --cov=testing \
            --cov-report=term --cov-report=xml \
            -v --tb=short -m "not slow"

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run python -m pytest tests/ -v --tb=short -m "not slow and not gui"

      - name: Install Nuitka
        run: uv pip install nuitka zstandard

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run python scripts/nuitka_build.py \
            --standalone --onefile \
            --output-filename=BacteriaAnalyzer \
            main.py

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          uv run python scripts/nuitka_build.py `
            --standalone --onefile `
            --msvc=latest `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --jobs=2 `
            --output-filename=BacteriaAnalyzer.exe `
            main.py

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Linux
          path: BacteriaAnalyzer

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Windows
          path: BacteriaAnalyzer.exe
