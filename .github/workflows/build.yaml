name: Build BacteriaAnalyzer

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - main
      - feature/*

jobs:
  build-executable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++ patchelf

      - name: Install MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Install project dependencies
        run: uv sync

      - name: Install Nuitka
        run: uv pip install nuitka zstandard

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run -- nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyqt6 \
            --enable-plugin=numpy \
            --include-package=ui \
            --include-package=analysis \
            --include-package=utils \
            --include-package=labeling \
            --include-module=cv2 \
            --include-module=albumentations \
            --include-module=tqdm \
            --output-filename=BacteriaAnalyzer \
            main.py

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          uv run -- nuitka `
            --standalone `
            --onefile `
            --mingw64 `
            --enable-plugin=pyqt6 `
            --enable-plugin=numpy `
            --include-package=ui `
            --include-package=analysis `
            --include-package=utils `
            --include-package=labeling `
            --include-module=cv2 `
            --include-module=albumentations `
            --include-module=tqdm `
            --output-filename=BacteriaAnalyzer.exe `
            main.py

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Linux
          path: BacteriaAnalyzer

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Windows
          path: BacteriaAnalyzer.exe
