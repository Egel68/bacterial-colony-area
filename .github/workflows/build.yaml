name: Build BacteriaAnalyzer

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-executable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Шаг сборки для Linux (разделитель путей :)
      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name=BacteriaAnalyzer \
            --icon=icon.ico \
            --add-data="ui:ui" \
            --add-data="analysis:analysis" \
            --add-data="utils:utils" \
            --hidden-import=PyQt6.sip \
            --hidden-import=cv2 \
            --hidden-import=numpy \
            main.py

      # Шаг сборки для Windows (разделитель путей ;)
      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name=BacteriaAnalyzer `
            --icon=icon.ico `
            --add-data="ui;ui" `
            --add-data="analysis;analysis" `
            --add-data="utils;utils" `
            --hidden-import=PyQt6.sip `
            --hidden-import=cv2 `
            --hidden-import=numpy `
            main.py

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Linux
          path: dist/BacteriaAnalyzer

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BacteriaAnalyzer-Windows
          path: dist/BacteriaAnalyzer.exe
